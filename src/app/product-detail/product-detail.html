<section
  class="detail-page"
  *ngIf="product">

  <div class="detail-image">

    <img
      [src]="product.image"
      [alt]="product.name"
      (error)="imageError($event)">

  </div>


  <div class="detail-info">

    <p class="category">
      {{ product.gender }} ·
      {{ product.category }}
    </p>

    <h1>
      {{ product.name }}
    </h1>

    <div class="rating">
      ★ {{ product.rating }}
    </div>

    <div class="price">

      <strong>
        ${{ product.price | number:'1.2-2' }}
      </strong>

      <del *ngIf="product.oldPrice">
        ${{ product.oldPrice | number:'1.2-2' }}
      </del>

    </div>

    <p class="description">
      {{ product.description }}
    </p>


    <div class="option">

      <label>
        Size
      </label>

      <div class="options">

        <button
          *ngFor="let size of product.sizes"
          [class.selected]="selectedSize === size"
          (click)="selectedSize = size">

          {{ size }}

        </button>

      </div>

    </div>


    <div class="option">

      <label>
        Color
      </label>

      <div class="options">

        <button
          *ngFor="let color of product.colors"
          [class.selected]="selectedColor === color"
          (click)="selectedColor = color">

          {{ color }}

        </button>

      </div>

    </div>


    <div class="quantity">

      <label>
        Quantity
      </label>

      <div class="quantity-control">

        <button
          (click)="decreaseQuantity()">
          −
        </button>

        <span>
          {{ quantity }}
        </span>

        <button
          (click)="increaseQuantity()">
          +
        </button>

      </div>

    </div>


    <button
      class="add-cart"
      (click)="addToCart()">

      Add to Cart

    </button>


    <a
      routerLink="/cart"
      class="view-cart">

      View Cart

    </a>

  </div>

</section>
